<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14203a"/></linearGradient>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="mV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4b5fd"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="url(#bg)"/>
  <text x="32" y="44" fill="#f8fafc" font-size="26" font-weight="800">τ²-bench, playable</text>
  <text x="32" y="68" fill="#94a3b8" font-size="14">Qwen3.8-27B serves a simulated customer through a real tool-using API, or you play the customer, and the official evaluator grades the outcome</text>

  <!-- TASK card -->
  <g>
    <rect x="32" y="120" width="180" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="48" y="146" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">TAU2 TASK</text>
    <rect x="48" y="158" width="148" height="14" rx="3" fill="#334155"/>
    <rect x="48" y="178" width="120" height="14" rx="3" fill="#334155"/>
    <rect x="48" y="198" width="136" height="14" rx="3" fill="#334155"/>
    <text x="48" y="234" fill="#cbd5e1" font-size="12">who you are · your script</text>
    <text x="48" y="252" fill="#cbd5e1" font-size="12">expected DB state + actions</text>
    <text x="122" y="296" fill="#cbd5e1" font-size="13" text-anchor="middle" font-weight="600">airline 50 · retail 114 · telecom</text>
  </g>
  <line x1="214" y1="195" x2="252" y2="195" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- CUSTOMER -->
  <g>
    <circle cx="322" cy="195" r="52" fill="#2a1f3d" stroke="#c4b5fd" stroke-width="2.5"/>
    <circle cx="322" cy="178" r="14" fill="#c4b5fd"/>
    <path d="M292,228 a30,22 0 0 1 60,0 z" fill="#c4b5fd"/>
    <text x="322" y="128" fill="#e9d5ff" font-size="14" text-anchor="middle" font-weight="700">customer</text>
    <text x="322" y="268" fill="#c4b5fd" font-size="12" text-anchor="middle">Qwen user-simulator</text>
    <text x="322" y="284" fill="#c4b5fd" font-size="12" text-anchor="middle" font-weight="700">or you, typing</text>
  </g>

  <!-- conversation arrows -->
  <line x1="380" y1="180" x2="486" y2="180" stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#mV)"/>
  <line x1="486" y1="210" x2="380" y2="210" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="433" y="172" fill="#94a3b8" font-size="11" text-anchor="middle">message</text>
  <text x="433" y="226" fill="#94a3b8" font-size="11" text-anchor="middle">reply</text>

  <!-- AGENT -->
  <g>
    <circle cx="546" cy="195" r="56" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2.5"/>
    <line x1="546" y1="164" x2="546" y2="152" stroke="#2dd4bf" stroke-width="3"/><circle cx="546" cy="149" r="4.5" fill="#2dd4bf"/>
    <rect x="518" y="164" width="56" height="44" rx="11" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="534" cy="183" r="5.5" fill="#5eead4"/><circle cx="558" cy="183" r="5.5" fill="#5eead4"/>
    <rect x="534" y="195" width="24" height="4.5" rx="2" fill="#5eead4"/>
    <text x="546" y="128" fill="#99f6e4" font-size="14" text-anchor="middle" font-weight="700">agent</text>
    <text x="546" y="272" fill="#5eead4" font-size="12" text-anchor="middle">Qwen3.8-27B on vLLM</text>
    <text x="546" y="288" fill="#94a3b8" font-size="12" text-anchor="middle">+ the domain policy</text>
  </g>

  <!-- tool arrows to API -->
  <line x1="606" y1="180" x2="706" y2="180" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#mA)"/>
  <line x1="706" y1="210" x2="606" y2="210" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#mA)"/>
  <text x="656" y="172" fill="#fde68a" font-size="11" text-anchor="middle">tool calls</text>
  <text x="656" y="226" fill="#fde68a" font-size="11" text-anchor="middle">results</text>

  <!-- API + DB -->
  <g>
    <rect x="712" y="130" width="216" height="130" rx="12" fill="#2a1f0a" stroke="#fbbf24" stroke-width="2"/>
    <text x="728" y="156" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1">MOCK BUSINESS API</text>
    <text x="728" y="180" fill="#fde68a" font-size="12" font-family="Menlo, Consolas, monospace">get_user · search_flights</text>
    <text x="728" y="198" fill="#fde68a" font-size="12" font-family="Menlo, Consolas, monospace">book · cancel · modify …</text>
    <ellipse cx="880" cy="222" rx="24" ry="7" fill="#422e0b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="856" y="222" width="48" height="20" fill="#422e0b"/>
    <line x1="856" y1="222" x2="856" y2="242" stroke="#fbbf24" stroke-width="1.5"/><line x1="904" y1="222" x2="904" y2="242" stroke="#fbbf24" stroke-width="1.5"/>
    <ellipse cx="880" cy="242" rx="24" ry="7" fill="#422e0b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="728" y="236" fill="#cbd5e1" font-size="12">a database the agent</text>
    <text x="728" y="252" fill="#cbd5e1" font-size="12">actually changes</text>
  </g>

  <!-- loop bracket -->
  <rect x="252" y="100" width="690" height="204" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="930" y="118" fill="#64748b" font-size="11" text-anchor="end">conversation loop · every message streams live</text>

  <!-- down to evaluator -->
  <line x1="820" y1="262" x2="820" y2="330" stroke="#f472b6" stroke-width="2.5" marker-end="url(#mP)"/>
  <text x="832" y="300" fill="#f9a8d4" font-size="11">end of call</text>

  <!-- EVALUATOR -->
  <g>
    <rect x="612" y="334" width="316" height="96" rx="12" fill="#3f1d2e" stroke="#f472b6" stroke-width="2"/>
    <text x="628" y="358" fill="#f472b6" font-size="11" font-weight="700" letter-spacing="1">TAU2 EVALUATOR</text>
    <text x="628" y="380" fill="#fce7f3" font-size="13">final DB state matches expected?</text>
    <text x="628" y="398" fill="#fce7f3" font-size="13">right write actions? NL assertions (gpt-4.1 judge)?</text>
    <text x="628" y="420" fill="#fbcfe8" font-size="13" font-weight="700">reward 0 / 1 → pass^k</text>
    <circle cx="900" cy="362" r="14" fill="#10b981"/><path d="M893,362 l5,5 l10,-10" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- results -->
  <g>
    <rect x="32" y="334" width="260" height="96" rx="12" fill="#132238" stroke="#1e3a5f"/>
    <text x="48" y="358" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">RESULTS · thinking off · 1 trial</text>
    <text x="48" y="386" fill="#f8fafc" font-size="20" font-weight="800">airline 0.74</text>
    <text x="180" y="386" fill="#94a3b8" font-size="12">pass^1, 50 tasks</text>
    <text x="48" y="414" fill="#f8fafc" font-size="20" font-weight="800">retail 0.79</text>
    <text x="180" y="414" fill="#94a3b8" font-size="12">pass^1, 114 tasks</text>
  </g>
  <g>
    <rect x="312" y="334" width="280" height="96" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="328" y="358" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">STATED CAVEAT</text>
    <text x="328" y="382" fill="#cbd5e1" font-size="12">the customer simulator is Qwen too, so these</text>
    <text x="328" y="400" fill="#cbd5e1" font-size="12">are indicative, not leaderboard numbers; the</text>
    <text x="328" y="418" fill="#cbd5e1" font-size="12">official gpt-4.1 simulator is one flag away</text>
  </g>

  <!-- footer -->
  <text x="32" y="470" fill="#e2e8f0" font-size="13" font-weight="600">Also in this repo</text>
  <rect x="32" y="482" width="420" height="40" rx="8" fill="#132238" stroke="#1e3a5f"/>
  <text x="48" y="498" fill="#f8fafc" font-size="12" font-weight="700">chat playground</text>
  <text x="48" y="514" fill="#94a3b8" font-size="11">answer and thinking in separate panels · 4 effort modes · images · tool loop</text>
  <rect x="468" y="482" width="460" height="40" rx="8" fill="#132238" stroke="#1e3a5f"/>
  <text x="484" y="498" fill="#f8fafc" font-size="12" font-weight="700">13 capability suites, self-grading · 57 / 60</text>
  <text x="484" y="514" fill="#94a3b8" font-size="11">vision on generated images · OCR · charts · tools · JSON · code vs hidden tests · 32K</text>
</svg>
