<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14203a"/></linearGradient>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="mV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="url(#bg)"/>
  <text x="32" y="44" fill="#f8fafc" font-size="22" font-weight="800">Frontier-set training: train only on questions the policy sometimes gets right</text>
  <text x="32" y="68" fill="#94a3b8" font-size="13">difficulty is measured with the policy itself, tracked per question, and a question retires once the policy has mastered it</text>

  <!-- POOL -->
  <g>
    <rect x="32" y="104" width="150" height="130" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="48" y="128" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">RL POOL</text>
    <rect x="52" y="140" width="62" height="44" rx="4" fill="#334155"/><rect x="60" y="148" width="62" height="44" rx="4" fill="#475569"/><rect x="68" y="156" width="62" height="44" rx="4" fill="#64748b"/>
    <text x="48" y="220" fill="#e2e8f0" font-size="12">14,500 questions</text>
    <text x="107" y="254" fill="#94a3b8" font-size="11" text-anchor="middle">HotpotQA-hard + 2Wiki</text>
  </g>
  <line x1="184" y1="170" x2="214" y2="170" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- MINE -->
  <g>
    <rect x="220" y="104" width="200" height="130" rx="12" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="236" y="128" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="1">MINE WITH THE POLICY</text>
    <text x="236" y="152" fill="#e2e8f0" font-size="12">the current policy answers</text>
    <text x="236" y="170" fill="#e2e8f0" font-size="12">each question 8 times, T = 0.9</text>
    <text x="236" y="196" fill="#94a3b8" font-size="11" font-family="Menlo, Consolas, monospace">distill/mine_frontier.py</text>
    <text x="236" y="218" fill="#94a3b8" font-size="11">7B: 3,900 scanned, one vLLM per GPU</text>
  </g>
  <line x1="422" y1="170" x2="452" y2="170" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- BUCKETS -->
  <g>
    <rect x="458" y="100" width="250" height="40" rx="8" fill="#132238" stroke="#1e3a5f"/>
    <g fill="#199e70"><circle cx="476" cy="120" r="4.5"/><circle cx="488" cy="120" r="4.5"/><circle cx="500" cy="120" r="4.5"/><circle cx="512" cy="120" r="4.5"/><circle cx="524" cy="120" r="4.5"/><circle cx="536" cy="120" r="4.5"/><circle cx="548" cy="120" r="4.5"/><circle cx="560" cy="120" r="4.5"/></g>
    <text x="574" y="116" fill="#e2e8f0" font-size="12" font-weight="700">8/8 always right</text>
    <text x="574" y="131" fill="#94a3b8" font-size="11">mastered · 54% · no signal</text>

    <rect x="458" y="148" width="250" height="44" rx="8" fill="#2a1f0a" stroke="#fbbf24" stroke-width="2"/>
    <g><circle cx="476" cy="170" r="4.5" fill="#199e70"/><circle cx="488" cy="170" r="4.5" fill="#d95926"/><circle cx="500" cy="170" r="4.5" fill="#199e70"/><circle cx="512" cy="170" r="4.5" fill="#199e70"/><circle cx="524" cy="170" r="4.5" fill="#d95926"/><circle cx="536" cy="170" r="4.5" fill="#199e70"/><circle cx="548" cy="170" r="4.5" fill="#d95926"/><circle cx="560" cy="170" r="4.5" fill="#199e70"/></g>
    <text x="574" y="166" fill="#fde68a" font-size="12" font-weight="700">1–7 of 8: frontier</text>
    <text x="574" y="181" fill="#fbbf24" font-size="11">32% · the only ones kept</text>

    <rect x="458" y="200" width="250" height="40" rx="8" fill="#132238" stroke="#1e3a5f"/>
    <g fill="#d95926"><circle cx="476" cy="220" r="4.5"/><circle cx="488" cy="220" r="4.5"/><circle cx="500" cy="220" r="4.5"/><circle cx="512" cy="220" r="4.5"/><circle cx="524" cy="220" r="4.5"/><circle cx="536" cy="220" r="4.5"/><circle cx="548" cy="220" r="4.5"/><circle cx="560" cy="220" r="4.5"/></g>
    <text x="574" y="216" fill="#e2e8f0" font-size="12" font-weight="700">0/8 never right</text>
    <text x="574" y="231" fill="#94a3b8" font-size="11">never · 14% · no signal</text>
  </g>
  <line x1="710" y1="170" x2="742" y2="170" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#mA)"/>

  <!-- KEEP LIST -->
  <g>
    <rect x="748" y="104" width="180" height="130" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="764" y="128" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">KEEP-LIST</text>
    <text x="764" y="158" fill="#f8fafc" font-size="24" font-weight="800">1,202</text>
    <text x="764" y="178" fill="#cbd5e1" font-size="12">frontier questions,</text>
    <text x="764" y="194" fill="#cbd5e1" font-size="12">601 per source</text>
    <text x="764" y="218" fill="#94a3b8" font-size="11">balanced by dataset</text>
  </g>
  <line x1="838" y1="236" x2="838" y2="280" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- SAMPLER -->
  <g>
    <rect x="712" y="286" width="216" height="118" rx="12" fill="#150f2a" stroke="#a78bfa" stroke-width="2"/>
    <text x="728" y="310" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1">FRONTIER SAMPLER</text>
    <text x="728" y="332" fill="#e2e8f0" font-size="12">serves only frontier questions</text>
    <text x="728" y="350" fill="#e2e8f0" font-size="12">to veRL's dataloader</text>
    <text x="728" y="372" fill="#94a3b8" font-size="11">installed via a Ray worker hook;</text>
    <text x="728" y="388" fill="#94a3b8" font-size="11">neither veRL nor rLLM expose one</text>
  </g>
  <line x1="710" y1="345" x2="672" y2="345" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#mV)"/>

  <!-- GRPO -->
  <g>
    <rect x="466" y="286" width="200" height="118" rx="12" fill="#150f2a" stroke="#a78bfa" stroke-width="2"/>
    <text x="482" y="310" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1">GRPO STEP</text>
    <text x="482" y="334" fill="#e2e8f0" font-size="12">32 questions × 16 rollouts</text>
    <text x="482" y="352" fill="#e2e8f0" font-size="12">mixed groups carry gradient</text>
    <text x="482" y="376" fill="#94a3b8" font-size="11">7B: 166 s/step on 2× A100</text>
    <text x="482" y="392" fill="#94a3b8" font-size="11">3B: ~100 s/step on 2× A100</text>
  </g>
  <line x1="464" y1="345" x2="426" y2="345" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#mT)"/>
  <text x="445" y="336" fill="#99f6e4" font-size="10" text-anchor="middle">outcomes</text>

  <!-- LEDGER -->
  <g>
    <rect x="220" y="286" width="200" height="118" rx="12" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="236" y="310" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="1">PER-QUESTION LEDGER</text>
    <text x="236" y="332" fill="#e2e8f0" font-size="12">every observation, every</text>
    <text x="236" y="350" fill="#e2e8f0" font-size="12">state change, with its step</text>
    <text x="236" y="374" fill="#fde68a" font-size="11">retire after 2 uniform groups:</text>
    <text x="236" y="390" fill="#fde68a" font-size="11">all right → mastered</text>
  </g>
  <!-- re-mine loop from ledger up to MINE -->
  <line x1="320" y1="284" x2="320" y2="240" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#mT)"/>
  <text x="330" y="266" fill="#99f6e4" font-size="11">stage 2: re-mine from the ledger with the new policy</text>

  <!-- verify strip on left -->
  <g>
    <rect x="32" y="286" width="170" height="118" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="48" y="310" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">VERIFIED</text>
    <circle cx="176" cy="306" r="11" fill="#10b981"/><path d="M170,306 l4,4 l8,-8" fill="none" stroke="#052e16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="334" fill="#e2e8f0" font-size="12">every served question</text>
    <text x="48" y="352" fill="#e2e8f0" font-size="12">was on the keep-list:</text>
    <text x="48" y="374" fill="#f8fafc" font-size="14" font-weight="800">0 outside</text>
    <text x="48" y="392" fill="#94a3b8" font-size="10" font-family="Menlo, Consolas, monospace">curriculum.verify_served</text>
  </g>

  <!-- STAT TILES -->
  <text x="32" y="440" fill="#e2e8f0" font-size="13" font-weight="600">What it changed (7B)</text>
  <g>
    <rect x="32" y="452" width="286" height="84" rx="10" fill="#132238" stroke="#1e3a5f"/>
    <text x="48" y="474" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">GROUPS WITH NO GRADIENT</text>
    <text x="48" y="504" fill="#f8fafc" font-size="22" font-weight="800">0.7 → 0.3</text>
    <text x="48" y="524" fill="#94a3b8" font-size="11">label-based "hard" slice vs frontier</text>

    <rect x="337" y="452" width="286" height="84" rx="10" fill="#132238" stroke="#1e3a5f"/>
    <text x="353" y="474" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">FRONTIER OVER 100 STEPS</text>
    <text x="353" y="504" fill="#f8fafc" font-size="22" font-weight="800">1,245 → 940</text>
    <text x="353" y="524" fill="#94a3b8" font-size="11">289 mastered in training · 55% 8/8 on re-scan</text>

    <rect x="642" y="452" width="286" height="84" rx="10" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="658" y="474" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="1">HELD-OUT, CORRECT &amp; CITED</text>
    <text x="658" y="504" fill="#f8fafc" font-size="22" font-weight="800">0.390 → 0.477</text>
    <text x="658" y="524" fill="#94a3b8" font-size="11">+8.7, about 3× the noise floor · label slice: flat</text>
  </g>
</svg>
