<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14203a"/>
    </linearGradient>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="720" height="560" rx="16" fill="url(#bg)"/>
  <text x="32" y="44" fill="#f8fafc" font-size="22" font-weight="800">The post-training stack, by hand</text>
  <text x="32" y="66" fill="#94a3b8" font-size="13">six labs · the objective in each is hand-written and unit-tested · one 8 GB GPU</text>

  <!-- spine -->
  <line x1="60" y1="100" x2="60" y2="520" stroke="#334155" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- tile template: y positions 92,164,236,308,380,452 ; height 60 -->
