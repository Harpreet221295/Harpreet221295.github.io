    <text x="112" y="404" fill="#f8fafc" font-size="14" font-weight="700">On-policy distillation</text>
    <text x="112" y="424" fill="#94a3b8" font-size="12">full-vocab forward vs reverse KL · on-policy tokens</text>
    <text x="672" y="406" fill="#5eead4" font-size="16" font-weight="800" text-anchor="end">12.5 → 27.0 → 31.5%</text>
    <text x="672" y="424" fill="#94a3b8" font-size="11" text-anchor="end">GSM8K · gap ≈ 1 SE</text>
  </g>
  <g>
    <circle cx="60" cy="482" r="16" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/><text x="60" y="487" fill="#5eead4" font-size="12" font-weight="700" text-anchor="middle">06</text>
    <rect x="96" y="452" width="592" height="60" rx="10" fill="#132238" stroke="#1e3a5f"/>
    <text x="112" y="476" fill="#f8fafc" font-size="14" font-weight="700">Agent trajectory synthesis</text>
    <text x="112" y="496" fill="#94a3b8" font-size="12">grounded checker · hindsight relabel · masked obs</text>
    <text x="672" y="478" fill="#5eead4" font-size="16" font-weight="800" text-anchor="end">0% → 65%</text>
    <text x="672" y="496" fill="#94a3b8" font-size="11" text-anchor="end">no-demo tool use · n=20</text>
  </g>
  <text x="360" y="544" fill="#64748b" font-size="11" text-anchor="middle">every core objective hand-written · every lab evaluated base vs tuned with its noise floor · negative results kept</text>
