    <text x="112" y="332" fill="#f8fafc" font-size="14" font-weight="700">RLVR on GSM8K</text>
    <text x="112" y="352" fill="#94a3b8" font-size="12">hand-written verifier + group-relative PG · pass@k</text>
    <text x="672" y="334" fill="#fca5a5" font-size="16" font-weight="800" text-anchor="end">regression</text>
    <text x="672" y="352" fill="#94a3b8" font-size="11" text-anchor="end">below base at every k · diagnosed</text>
  </g>
  <g>
    <circle cx="60" cy="410" r="16" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/><text x="60" y="415" fill="#5eead4" font-size="12" font-weight="700" text-anchor="middle">05</text>
