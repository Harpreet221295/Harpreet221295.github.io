    <circle cx="60" cy="122" r="16" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/><text x="60" y="127" fill="#5eead4" font-size="12" font-weight="700" text-anchor="middle">01</text>
    <rect x="96" y="92" width="592" height="60" rx="10" fill="#132238" stroke="#1e3a5f"/>
    <text x="112" y="116" fill="#f8fafc" font-size="14" font-weight="700">PPO + GAE from scratch</text>
    <text x="112" y="136" fill="#94a3b8" font-size="12">BipedalWalker-v3 · clip loss, GAE, entropy bonus</text>
    <text x="672" y="118" fill="#5eead4" font-size="16" font-weight="800" text-anchor="end">−92 → 251</text>
    <text x="672" y="136" fill="#94a3b8" font-size="11" text-anchor="end">eval return, entropy floor A/B</text>
  </g>
  <g>
    <circle cx="60" cy="194" r="16" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/><text x="60" y="199" fill="#5eead4" font-size="12" font-weight="700" text-anchor="middle">02</text>
    <rect x="96" y="164" width="592" height="60" rx="10" fill="#132238" stroke="#1e3a5f"/>
    <text x="112" y="188" fill="#f8fafc" font-size="14" font-weight="700">SFT with a hand-written masked loss</text>
    <text x="112" y="208" fill="#94a3b8" font-size="12">base 0.5B → instruction follower · masking asserted</text>
    <text x="672" y="190" fill="#fcd34d" font-size="16" font-weight="800" text-anchor="end">10/15 → 4/15</text>
    <text x="672" y="208" fill="#94a3b8" font-size="11" text-anchor="end">degeneration · never learned to stop</text>
  </g>
  <g>
    <circle cx="60" cy="266" r="16" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/><text x="60" y="271" fill="#5eead4" font-size="12" font-weight="700" text-anchor="middle">03</text>
    <rect x="96" y="236" width="592" height="60" rx="10" fill="#132238" stroke="#1e3a5f"/>
    <text x="112" y="260" fill="#f8fafc" font-size="14" font-weight="700">DPO · SimPO · KTO, one harness</text>
    <text x="112" y="280" fill="#94a3b8" font-size="12">three preference losses, the loss is the only moving part</text>
    <text x="672" y="262" fill="#5eead4" font-size="16" font-weight="800" text-anchor="end">0.660</text>
    <text x="672" y="280" fill="#94a3b8" font-size="11" text-anchor="end">DPO pref-accuracy · degeneracy measured</text>
  </g>
  <g>
    <circle cx="60" cy="338" r="16" fill="#0f2a2a" stroke="#2dd4bf" stroke-width="2"/><text x="60" y="343" fill="#5eead4" font-size="12" font-weight="700" text-anchor="middle">04</text>
